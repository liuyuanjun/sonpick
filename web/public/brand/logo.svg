<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Sonpick 拾音">
  <defs>
    <linearGradient id="spg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="#0B0C10"/>
  <!-- 外圆 r=16.5 = 唱片外缘，缺口 240°~300°（正上方） -->
  <path d="M 32.25 9.71 A 16.5 16.5 0 1 1 15.75 9.71"
        stroke="url(#spg)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 内圆 r=8.5 = 唱片中心标签，与外圆同心，缺口 245°~295° -->
  <path d="M 27.59 16.30 A 8.5 8.5 0 1 1 20.41 16.30"
        stroke="url(#spg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- 音符 = 唱针搭在唱片上；伸出外圆的一段 = 叶柄 -->
  <ellipse cx="21.5" cy="25" rx="4" ry="3.2" transform="rotate(-30 21.5 25)" fill="url(#spg)"/>
  <path d="M 24 23 L 24 5" stroke="url(#spg)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 24 5 C 28.5 7, 29.5 11, 26 14" stroke="url(#spg)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
